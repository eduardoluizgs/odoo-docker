networks:
  odoo:
    name: odoo_default
    external: true

services:

  odoo_webserver:
    container_name: odoo_webserver
    deploy:
      restart_policy:
        condition: 'no'
      resources:
        reservations:
          memory: 0M
        limits:
          cpus: '0.5'
          memory: 1000M
    build:
      context: ./build/odoo
      dockerfile: Dockerfile
    image: ${ODOO_IMAGE}
    depends_on:
      - odoo_postgres
    entrypoint: "/entrypoint.sh ${COMMAND:-odoo}"
    volumes:
      - ./addons:/mnt/extra-addons                            # Odoo Addons Extra
      # - ./storage:/opt/storage                              # Odoo Storage
      - odooapp_cache:/var/lib/odoo                           # Odoo Data
      - ./build/odoo/odoo.conf:/etc/odoo/odoo.conf            # Odoo Conf
      - ./build/odoo/entrypoint.sh:/entrypoint.sh             # Odoo entrypoint
      - ./build/odoo/odoo:/usr/bin/odoo                       # Odoo Bin
      # /usr/local/lib                                        # Python Files
      # /usr/lib/python3/dist-packages/odoo                   # Odoo Modules
      # /var/log/odoo/odoo.log                                # Odoo Logs
    expose:
      - "8069"
    ports:
      - 8069:8069     # odoo webserver
      - 8071:8071     # odoo rpc
      - 8072:8072     # odoo longpolling
    environment:
      - HOST=${POSTGRES_HOST}
      - PORT=${POSTGRES_PORT}
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE=${ODOO_DATABASE}
      - DATABASE_FILTER=${ODOO_DATABASE_FILTER}
      - DATABASE_INIT=${ODOO_DATABASE_INIT}
      - MODULES=${ODOO_MODULES}
      - UPDATE=${ODOO_UPDATE}
      - ODOO_ENV=${ODOO_ENV}

  odoo_postgres:
    container_name: odoo_postgres
    deploy:
      restart_policy:
        condition: 'no'
      resources:
        reservations:
          memory: 0M
        limits:
          cpus: '0.5'
          memory: 512M
    image: postgres:13
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${ODOO_DATABASE}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data

volumes:
  odooapp_cache:
  postgresql_data:
